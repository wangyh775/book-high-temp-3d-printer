---
name: Build Book & Deploy to GitHub Pages

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Chinese Fonts & Typography Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fontconfig
          fc-cache -fv

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: pre-release

      - name: Verify Quarto & Typst Installation
        run: |
          quarto --version
          quarto check

      - name: Compile Book to PDF (Typst Orange-Book)
        run: |
          quarto render --to typst
          mkdir -p /tmp/quarto-pdf
          cp _book/high-temp-3d-printer.pdf /tmp/quarto-pdf/

      - name: Compile Single Chapter PDFs (Standalone Mode)
        run: |
          mkdir -p /tmp/chapter-pdfs
          for dir in chapters/* appendices/*; do
            if [ -f "$dir/index.qmd" ]; then
              echo "Rendering standalone PDF for $dir/index.qmd"
              quarto render "$dir/index.qmd" --profile chapter --to typst
              mkdir -p "/tmp/chapter-pdfs/$dir"
              cp "_book/$dir/index.pdf" "/tmp/chapter-pdfs/$dir/"
            fi
          done

      - name: Compile Book & Chapters to Word (Docx for Review)
        run: |
          mkdir -p /tmp/quarto-docx
          mkdir -p /tmp/chapter-docx
          echo "Rendering whole book docx"
          quarto render --to docx
          cp _book/high-temp-3d-printer.docx /tmp/quarto-docx/
          for dir in chapters/* appendices/*; do
            if [ -f "$dir/index.qmd" ]; then
              echo "Rendering standalone docx for $dir/index.qmd"
              quarto render "$dir/index.qmd" --profile chapter --to docx
              mkdir -p "/tmp/chapter-docx/$dir"
              cp "_book/$dir/index.docx" "/tmp/chapter-docx/$dir/"
            fi
          done

      - name: Compile Book to HTML (Interactive Web Book)
        run: |
          quarto render --to html
          cp /tmp/quarto-pdf/high-temp-3d-printer.pdf _book/
          cp /tmp/quarto-docx/high-temp-3d-printer.docx _book/
          cp -r /tmp/chapter-pdfs/* _book/
          cp -r /tmp/chapter-docx/* _book/

      - name: Verify Output Assets
        run: |
          echo "=== Generated files in _book/ ==="
          ls -lh _book/

      - name: Upload PDF Artifact (Commit & PR Preview)
        uses: actions/upload-artifact@v4
        with:
          name: high-temp-3d-printer-pdf
          path: _book/high-temp-3d-printer.pdf
          retention-days: 30

      - name: Upload Review Word Documents (Commit & PR Review)
        uses: actions/upload-artifact@v4
        with:
          name: review-word-documents
          path: |
            _book/high-temp-3d-printer.docx
            _book/chapters/*/*.docx
            _book/appendices/*/*.docx
          retention-days: 30

      - name: Upload Pages Artifact
        if: >-
          github.event_name == 'push' &&
          (github.ref == 'refs/heads/main' ||
           github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v3
        with:
          path: _book

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master')
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
...
